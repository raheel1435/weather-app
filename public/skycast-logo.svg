<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="110 70 460 460" role="img" aria-labelledby="title desc">
<title id="title">SkyCast animated glass logo</title><desc id="desc">A floating frosted glass cloud with a luminous sun and gently moving atmospheric rings.</desc>
<defs>
<radialGradient id="orb" cx=".3" cy=".2" r=".85"><stop stop-color="#fff" stop-opacity=".38"/><stop offset=".25" stop-color="#58dcff" stop-opacity=".12"/><stop offset=".65" stop-color="#253386" stop-opacity=".22"/><stop offset="1" stop-color="#aa76ff" stop-opacity=".48"/></radialGradient>
<linearGradient id="ring"><stop stop-color="#5cf6ff"/><stop offset=".5" stop-color="#8473ff"/><stop offset="1" stop-color="#ffadcc"/></linearGradient>
<radialGradient id="orbshine"><stop stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>

 <radialGradient id="bg"><stop stop-color="#252253"/><stop offset="1" stop-color="#080f20"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e6fcff" stop-opacity=".6"/><stop offset=".4" stop-color="#96e7ff" stop-opacity=".2"/><stop offset="1" stop-color="#35b4dc" stop-opacity=".1"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="white" stop-opacity=".95"/><stop offset=".45" stop-color="#b1f5ff" stop-opacity=".35"/><stop offset="1" stop-color="#58c3f4" stop-opacity=".65"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff3c0"/><stop offset=".65" stop-color="#ffd178"/><stop offset="1" stop-color="#f69e55"/></radialGradient>
 <linearGradient id="type" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b3d9ec"/></linearGradient>
 <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".4"/></filter>
 <path id="cloud" d="M235 355 C197 355 173 331 173 300 C173 270 195 248 225 244 C223 204 253 174 291 174 C327 174 354 198 359 232 C373 224 387 220 402 220 C437 220 465 247 466 280 C497 283 519 301 519 327 C519 351 499 370 469 370 L237 370 C222 370 214 362 235 355Z"/>
 <clipPath id="clip"><use href="#cloud"/></clipPath>
</defs>

<ellipse cx="335" cy="300" rx="195" ry="135" fill="#17bdcf" opacity=".14" filter="url(#blur)"/>
<circle cx="427" cy="219" r="77" fill="#ffb455" opacity=".2" filter="url(#blur)"/>
<circle cx="348" cy="293" r="199" fill="#6158ec" opacity=".15" filter="url(#blur)"/>
<circle cx="348" cy="293" r="179" fill="url(#orb)" stroke="url(#edge)" stroke-width="1.5"/>
<circle cx="348" cy="293" r="168" fill="none" stroke="white" stroke-opacity=".08"/>
<ellipse cx="302" cy="164" rx="87" ry="22" fill="url(#orbshine)" transform="rotate(-22 302 164)" opacity=".65"/>
<path d="M190 294 A160 160 0 0 1 320 137" fill="none" stroke="#c4f7ff" stroke-width="3" opacity=".55" stroke-linecap="round"/>
<g fill="none" stroke="url(#ring)">
<ellipse cx="348" cy="293" rx="230" ry="76" transform="rotate(-27 348 293)" stroke-width="2" opacity=".75"/>
<ellipse cx="348" cy="293" rx="232" ry="78" transform="rotate(-27 348 293)" stroke-width="9" opacity=".08"/>
<circle cx="348" cy="293" r="197" stroke-width="2" stroke-dasharray="12 1224" opacity=".9">
<animateTransform attributeName="transform" type="rotate" values="0 348 293;360 348 293" dur="18s" repeatCount="indefinite"/>
</circle></g>
<g>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite"/>
 <g>
  <animateTransform attributeName="transform" type="rotate" values="0 420 225;360 420 225" dur="60s" repeatCount="indefinite"/>
  <circle cx="420" cy="225" r="83" fill="none" stroke="#ffd588" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="3 14"/>
 </g>
 <circle cx="420" cy="225" r="73" fill="#ffcd74" opacity=".35" filter="url(#blur)"><animate attributeName="opacity" values=".25;.55;.25" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="225" r="65" fill="url(#sun)"/>
 <circle cx="420" cy="225" r="55" fill="none" stroke="#fff4d5" stroke-opacity=".35"/>
 <use href="#cloud" fill="url(#glass)" stroke="url(#edge)" stroke-width="2" filter="url(#shadow)"/>
 <g clip-path="url(#clip)">
  <ellipse cx="300" cy="200" rx="195" ry="100" fill="#fff" opacity=".07"/>
  <rect x="-200" y="150" width="85" height="260" fill="url(#shine)" transform="skewX(-24)">
   <animate attributeName="x" values="-200;700;700" keyTimes="0;.65;1" dur="9s" repeatCount="indefinite"/>
  </rect>
 </g>
 <path d="M187 292 C191 271 208 256 235 256 C231 216 255 189 288 188" fill="none" stroke="white" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
 <path d="M244 350 H462" stroke="#9ce9ff" stroke-opacity=".18" stroke-width="1"/>
</g>


<g fill="#b8f5ff"><circle cx="170" cy="217" r="3" opacity=".65"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="489" cy="408" r="2" opacity=".5"><animate attributeName="opacity" values=".6;.1;.6" dur="5s" repeatCount="indefinite"/></circle></g>
</svg>
